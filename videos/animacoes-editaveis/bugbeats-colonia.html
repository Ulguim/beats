<script>
const frac=x=>x-Math.floor(x); const kick=b=>Math.exp(-4*frac(b));
const amps=[2, 3, 5, 4, 6, 8, 7, 5, 3, 4, 6, 9, 7, 4, 2, 3, 5, 7, 6, 4, 3, 2];
window.setT=b=>{ for(let i=0;i<amps.length;i++){ const env=0.45+0.55*kick(b+(i%4===0?0:0.5*(i%2)));
 const w=0.6+0.4*Math.abs(Math.sin(Math.PI*(b/4+i*0.13)));
 const h=Math.max(1,Math.min(10,Math.round(amps[i]*env*w*1.25)));
 for(let j=0;j<10;j++) document.getElementById('c'+i+'_'+j).style.display=j<h?'':'none'; } };
window.ready=true;
const BPM=174;
if(!navigator.webdriver){const t0=performance.now();const loop=now=>{window.setT(((now-t0)/1000*BPM/60)%16);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
