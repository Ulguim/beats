<!doctype html>
<!--
  ANIMAÇÃO EDITÁVEL: bugbeats-dj
  Abra este arquivo no Chrome ou Firefox: a animação toca sozinha em loop.
  - BPM: troque o valor de BPM logo abaixo (padrão 174).
  - Cores: use "localizar e substituir" no editor de texto:
      #111111 preto  ·  #F2A13B laranja  ·  #EDE6DA creme  ·  #C8322B vermelho
  - Textos: procure o texto (ex.: "@bugbeats" ou "DRUM N BASS") e edite direto.
  - O movimento fica na função window.setT, no fim do arquivo: ela recebe a batida atual
    (0 a 16) e mexe nos elementos. kick(b) é um pulso que cai a cada batida.
  - Para gerar o MP4 de novo, veja o LEIA-ME.txt.
-->
<html><head><meta charset="utf-8"><style>@font-face{font-family:'Russo One';src:url(fontes/RussoOne-Regular.ttf)}@font-face{font-family:'Silkscreen';src:url(fontes/Silkscreen-Regular.ttf)}body{margin:0;background:#EDE6DA}</style></head><body>

</svg>
<script>
const frac=x=>x-Math.floor(x); const kick=b=>Math.exp(-4*frac(b));
window.setT=b=>{ document.querySelectorAll('.spin').forEach(g=>g.setAttribute('transform',`rotate(${b*90} ${g.dataset.cx} ${g.dataset.cy})`));
 const k=kick(b); document.getElementById('bob').setAttribute('transform',`translate(0 ${-14*k})`);
 document.getElementById('tilt').setAttribute('transform',`rotate(${-6+5*Math.sin(Math.PI*b/2)} 140 150)`); };
window.ready=true;
const BPM=174;
if(!navigator.webdriver){const t0=performance.now();const loop=now=>{window.setT(((now-t0)/1000*BPM/60)%16);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
</script></body></html>
