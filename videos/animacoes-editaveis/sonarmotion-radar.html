<!doctype html>
<!--
  ANIMAÇÃO EDITÁVEL: sonarmotion-radar
  Abra este arquivo no Chrome ou Firefox: a animação toca sozinha em loop.
  - BPM: troque o valor de BPM logo abaixo (padrão 174).
  - Cores: use "localizar e substituir" no editor de texto:
      #111111 preto  ·  #F2A13B laranja  ·  #EDE6DA creme  ·  #C8322B vermelho
  - Textos: procure o texto (ex.: "@bugbeats" ou "DRUM N BASS") e edite direto.
  - O movimento fica na função window.setT, no fim do arquivo: ela recebe a batida atual
    (0 a 16) e mexe nos elementos. kick(b) é um pulso que cai a cada batida.
  - Para gerar o MP4 de novo, veja o LEIA-ME.txt.
-->
<html><head><meta charset="utf-8"><style>@font-face{font-family:'Russo One';src:url(fontes/RussoOne-Regular.ttf)}@font-face{font-family:'Silkscreen';src:url(fontes/Silkscreen-Regular.ttf)}body{margin:0;background:#EDE6DA}</style></head><body>
<svg id="root" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#EDE6DA"/>
<text x="540" y="200" text-anchor="middle" font-family="Silkscreen, monospace" font-size="34" letter-spacing="12" fill="#111111">@sonarmotion</text>
<g transform="translate(0 420) scale(1.5)"><rect width="720" height="720" fill="#EDE6DA"/><text x="134.29125" y="300" font-family="Russo One, sans-serif" font-size="118" fill="#111111">S</text>
<circle cx="272.09375" cy="257.52" r="50.74" fill="#111111"/><circle cx="272.09375" cy="257.52" r="17.759" fill="none" stroke="#EDE6DA" stroke-width="3"/><circle cx="272.09375" cy="257.52" r="32.981" fill="none" stroke="#EDE6DA" stroke-width="3"/>
<g id="sweep"><path d="M272.09375 257.52 L272.09375 206.77999999999997 A50.74 50.74 0 0 1 316.23755 232.14999999999998 Z" fill="#F2A13B"/></g><circle id="blip" cx="293.40455" cy="238.23879999999997" r="6" fill="#EDE6DA"/>
<text x="330.83375" y="300" font-family="Russo One, sans-serif" font-size="118" fill="#111111">NAR</text>
<text x="360" y="420" text-anchor="middle" font-family="Russo One, sans-serif" font-size="118" fill="#F2A13B">MOTION</text>
<text x="360" y="500" text-anchor="middle" font-family="Silkscreen, monospace" font-size="18" letter-spacing="7" fill="#111111">DRUM N BASS · LIQUID</text></g>
<text x="540" y="1700" text-anchor="middle" font-family="Silkscreen, monospace" font-size="28" letter-spacing="10" fill="#111111">DRUM N BASS · 2000-2006</text>
</svg>
<script>
const frac=x=>x-Math.floor(x); const kick=b=>Math.exp(-4*frac(b));
window.setT=b=>{const a=(b/4)*360; document.getElementById('sweep').setAttribute('transform',`rotate(${a} 272.09375 257.52)`);
 const d=((a%360)+360)%360; const blipA=48; const since=((d-blipA)%360+360)%360; document.getElementById('blip').setAttribute('opacity',(0.25+0.75*Math.exp(-since/60)).toFixed(2));};
window.ready=true;
const BPM=174;
if(!navigator.webdriver){const t0=performance.now();const loop=now=>{window.setT(((now-t0)/1000*BPM/60)%16);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
</script></body></html>
