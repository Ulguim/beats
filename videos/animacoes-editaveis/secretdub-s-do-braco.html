<!doctype html>
<!--
  ANIMAÇÃO EDITÁVEL: secretdub-s-do-braco
  Abra este arquivo no Chrome ou Firefox: a animação toca sozinha em loop.
  - BPM: troque o valor de BPM logo abaixo (padrão 174).
  - Cores: use "localizar e substituir" no editor de texto:
      #111111 preto  ·  #F2A13B laranja  ·  #EDE6DA creme  ·  #C8322B vermelho
  - Textos: procure o texto (ex.: "@bugbeats" ou "DRUM N BASS") e edite direto.
  - O movimento fica na função window.setT, no fim do arquivo: ela recebe a batida atual
    (0 a 16) e mexe nos elementos. kick(b) é um pulso que cai a cada batida.
  - Para gerar o MP4 de novo, veja o LEIA-ME.txt.
-->
<html><head><meta charset="utf-8"><style>@font-face{font-family:'Russo One';src:url(fontes/RussoOne-Regular.ttf)}@font-face{font-family:'Silkscreen';src:url(fontes/Silkscreen-Regular.ttf)}body{margin:0;background:#EDE6DA}</style></head><body>
<svg id="root" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#EDE6DA"/>
<text x="540" y="200" text-anchor="middle" font-family="Silkscreen, monospace" font-size="34" letter-spacing="12" fill="#111111">@secretdub</text>
<g transform="translate(0 420) scale(1.5)"><rect width="720" height="720" fill="#EDE6DA"/><g transform="translate(360 290) scale(.8) translate(-340 -320)"><circle cx="330" cy="340" r="250" fill="#111111"/><circle cx="330" cy="340" r="112" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="120" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="128" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="136" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="144" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="152" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="160" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="168" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="176" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="184" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="192" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="200" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="208" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="216" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="224" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="232" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="330" cy="340" r="240" fill="none" stroke="#3c3c3c" stroke-width="2"/><g class="spin" data-cx="330" data-cy="340"><path d="M330 340 L572.5 277.5 A242.5 242.5 0 0 1 555.0 440.0 Z" fill="#fff" opacity=".1"/><circle cx="330" cy="340" r="82.5" fill="#C8322B"/><path d="M330 257.5 A82.5 82.5 0 0 1 412.5 340" fill="none" stroke="#EDE6DA" stroke-width="4"/></g><circle cx="330" cy="340" r="10.0" fill="#EDE6DA"/>
<g id="sarm"><circle cx="500" cy="120" r="30" fill="#EDE6DA" stroke="#111111" stroke-width="10"/><path d="M500 120 C 360 60, 220 150, 300 250 C 360 330, 520 330, 470 450 C 430 540, 270 560, 210 500" fill="none" stroke="#111111" stroke-width="58" stroke-linecap="round"/><path d="M500 120 C 360 60, 220 150, 300 250 C 360 330, 520 330, 470 450 C 430 540, 270 560, 210 500" fill="none" stroke="#EDE6DA" stroke-width="38" stroke-linecap="round"/>
<rect x="180" y="480" width="56" height="34" rx="6" transform="rotate(40 208 497)" fill="#C8322B" stroke="#111111" stroke-width="8"/></g></g>
<text x="360" y="640" text-anchor="middle" font-family="Russo One, sans-serif" font-size="64" letter-spacing="8" fill="#111111">SECRET<tspan fill="#C8322B">DUB</tspan></text></g>
<text x="540" y="1700" text-anchor="middle" font-family="Silkscreen, monospace" font-size="28" letter-spacing="10" fill="#111111">DRUM N BASS · 2000-2006</text>
</svg>
<script>
const frac=x=>x-Math.floor(x); const kick=b=>Math.exp(-4*frac(b));
window.setT=b=>{document.querySelectorAll('.spin').forEach(g=>g.setAttribute('transform',`rotate(${b*90} ${g.dataset.cx} ${g.dataset.cy})`));
 document.getElementById('sarm').setAttribute('transform',`rotate(${2.2*Math.sin(Math.PI*b/2)} 500 120)`);};
window.ready=true;
const BPM=174;
if(!navigator.webdriver){const t0=performance.now();const loop=now=>{window.setT(((now-t0)/1000*BPM/60)%16);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
</script></body></html>
