<!doctype html>
<!--
  ANIMAÇÃO EDITÁVEL: secretdub-dub-vinil
  Abra este arquivo no Chrome ou Firefox: a animação toca sozinha em loop.
  - BPM: troque o valor de BPM logo abaixo (padrão 174).
  - Cores: use "localizar e substituir" no editor de texto:
      #111111 preto  ·  #F2A13B laranja  ·  #EDE6DA creme  ·  #C8322B vermelho
  - Textos: procure o texto (ex.: "@bugbeats" ou "DRUM N BASS") e edite direto.
  - O movimento fica na função window.setT, no fim do arquivo: ela recebe a batida atual
    (0 a 16) e mexe nos elementos. kick(b) é um pulso que cai a cada batida.
  - Para gerar o MP4 de novo, veja o LEIA-ME.txt.
-->
<html><head><meta charset="utf-8"><style>@font-face{font-family:'Russo One';src:url(fontes/RussoOne-Regular.ttf)}@font-face{font-family:'Silkscreen';src:url(fontes/Silkscreen-Regular.ttf)}body{margin:0;background:#EDE6DA}</style></head><body>
<svg id="root" width="1080" height="1920" viewBox="0 0 1080 1920">

<text x="540" y="200" text-anchor="middle" font-family="Silkscreen, monospace" font-size="34" letter-spacing="12" fill="#111111">@secretdub</text>
<g transform="translate(0 420) scale(1.5)"><rect width="720" height="720" fill="#EDE6DA"/><text x="360" y="160" text-anchor="middle" font-family="Russo One, sans-serif" font-size="58" letter-spacing="30" fill="#111111">SECRET</text><g transform="translate(26 0)"><path d="M80 200 h40 a130 130 0 0 1 0 260 h-40 Z" fill="#111111"/><clipPath id="gd"><path d="M80 200 h40 a130 130 0 0 1 0 260 h-40 Z"/></clipPath><g clip-path="url(#gd)"><circle cx="120" cy="330" r="58" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="66" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="74" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="82" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="90" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="98" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="106" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="114" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="120" cy="330" r="122" fill="none" stroke="#3c3c3c" stroke-width="2"/><g class="spin" data-cx="120" data-cy="330"><path d="M120 330 L250 310.5 L250 349.5 Z" fill="#fff" opacity=".14"/></g></g><clipPath id="hd"><rect x="120" y="288" width="42" height="84"/></clipPath><g clip-path="url(#hd)"><g class="spin" data-cx="120" data-cy="330"><circle cx="120" cy="330" r="42" fill="#C8322B"/><path d="M120 288 A42 42 0 0 1 162 330" fill="none" stroke="#EDE6DA" stroke-width="3"/></g></g><g id="arm"><path d="M300 200 V380 a60 60 0 0 0 120 0 V200" fill="none" stroke="#111111" stroke-width="44"/><path d="M300 200 V380 a60 60 0 0 0 120 0 V200" fill="none" stroke="#EDE6DA" stroke-width="12"/><rect x="398" y="186" width="44" height="26" fill="#C8322B"/></g><path d="M480 200 h30 a62 62 0 0 1 0 124 h-30 Z" fill="#111111"/><path d="M480 324 h30 a68 68 0 0 1 0 136 h-30 Z" fill="#111111"/><clipPath id="gb1"><path d="M480 200 h30 a62 62 0 0 1 0 124 h-30 Z"/></clipPath><g clip-path="url(#gb1)"><circle cx="510" cy="262" r="27" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="262" r="35" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="262" r="43" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="262" r="51" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="262" r="59" fill="none" stroke="#3c3c3c" stroke-width="2"/><g class="spin" data-cx="510" data-cy="262"><path d="M510 262 L572 252.7 L572 271.3 Z" fill="#fff" opacity=".14"/></g></g><clipPath id="gb2"><path d="M480 324 h30 a68 68 0 0 1 0 136 h-30 Z"/></clipPath><g clip-path="url(#gb2)"><circle cx="510" cy="392" r="30" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="392" r="38" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="392" r="46" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="392" r="54" fill="none" stroke="#3c3c3c" stroke-width="2"/><circle cx="510" cy="392" r="62" fill="none" stroke="#3c3c3c" stroke-width="2"/><g class="spin" data-cx="510" data-cy="392"><path d="M510 392 L578 381.8 L578 402.2 Z" fill="#fff" opacity=".14"/></g></g><clipPath id="hb1"><rect x="510" y="242" width="20" height="40"/></clipPath><g clip-path="url(#hb1)"><g class="spin" data-cx="510" data-cy="262"><circle cx="510" cy="262" r="20" fill="#C8322B"/><path d="M510 242 A20 20 0 0 1 530 262" fill="none" stroke="#EDE6DA" stroke-width="3"/></g></g><clipPath id="hb2"><rect x="510" y="370" width="22" height="44"/></clipPath><g clip-path="url(#hb2)"><g class="spin" data-cx="510" data-cy="392"><circle cx="510" cy="392" r="22" fill="#C8322B"/><path d="M510 370 A22 22 0 0 1 532 392" fill="none" stroke="#EDE6DA" stroke-width="3"/></g></g></g><text x="360" y="560" text-anchor="middle" font-family="Silkscreen, monospace" font-size="18" letter-spacing="7" fill="#111111">DUBPLATE · DRUM N BASS · LIQUID</text></g>
<text x="540" y="1700" text-anchor="middle" font-family="Silkscreen, monospace" font-size="28" letter-spacing="10" fill="#111111">DRUM N BASS · 2000-2006</text>
</svg>
<script>
const frac=x=>x-Math.floor(x); const kick=b=>Math.exp(-4*frac(b));
window.setT=b=>{document.querySelectorAll('.spin').forEach(g=>g.setAttribute('transform',`rotate(${b*90} ${g.dataset.cx} ${g.dataset.cy})`));
 document.getElementById('arm').setAttribute('transform',`translate(0 ${6*kick(b)})`);};
window.ready=true;
const BPM=174;
if(!navigator.webdriver){const t0=performance.now();const loop=now=>{window.setT(((now-t0)/1000*BPM/60)%16);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
</script></body></html>
