<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SonarGround</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: 'Space Grotesk', sans-serif">
<svg width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Símbolo SonarGround: linha do chão com ondas de som se espalhando por baixo">
<path d="M30 250 A110 110 0 0 0 250 250" fill="none" stroke="#3A5480" stroke-width="4" stroke-linecap="round" transform="translate(0 -130)"></path>
<path d="M65 120 A75 75 0 0 0 215 120" fill="none" stroke="#5F82B8" stroke-width="4" stroke-linecap="round"></path>
<path d="M100 120 A40 40 0 0 0 180 120" fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round"></path>
<line x1="22" y1="120" x2="258" y2="120" stroke="#D6DDE6" stroke-width="5" stroke-linecap="round"></line>
<circle cx="140" cy="120" r="9" fill="#D6DDE6"></circle>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-family: 'Michroma', sans-serif; font-size: 36px; letter-spacing: 0.12em; color: #D6DDE6">SONAR<span style="color: {{accent}}">GROUND</span></div>
<div style="font-size: 15px; letter-spacing: 0.18em; color: #8A97AB">DRUM &amp; BASS · LIQUID · 2000–2006</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 88px; height: 88px; border-radius: 50%; background: #121B2E; display: flex; align-items: center; justify-content: center">
<svg width="60" height="60" viewBox="0 0 280 280" aria-hidden="true">
<path d="M40 110 A100 100 0 0 0 240 110" fill="none" stroke="#5F82B8" stroke-width="12" stroke-linecap="round"></path>
<path d="M90 110 A50 50 0 0 0 190 110" fill="none" stroke="{{accent}}" stroke-width="12" stroke-linecap="round"></path>
<line x1="20" y1="110" x2="260" y2="110" stroke="#D6DDE6" stroke-width="14" stroke-linecap="round"></line>
</svg>
</div>
<div style="font-size: 14px; color: #8A97AB">como foto de perfil</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FB4E8"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8FB4E8', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
