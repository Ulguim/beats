<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>3AMRollers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: 'Space Grotesk', sans-serif">
<svg width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Símbolo 3AMRollers: relógio marcando três horas com arcos de movimento girando ao redor">
<circle cx="140" cy="140" r="80" fill="none" stroke="#D6DDE6" stroke-width="8"></circle>
<line x1="140" y1="140" x2="140" y2="82" stroke="#D6DDE6" stroke-width="6" stroke-linecap="round"></line>
<line x1="140" y1="140" x2="186" y2="140" stroke="{{accent}}" stroke-width="10" stroke-linecap="round"></line>
<circle cx="140" cy="140" r="7" fill="#D6DDE6"></circle>
<path d="M237.7 175.6 A104 104 0 0 1 158.1 242.4" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round"></path>
<path d="M245.7 201 A122 122 0 0 1 191.6 250.6" fill="none" stroke="#3A5480" stroke-width="5" stroke-linecap="round"></path>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-family: 'Michroma', sans-serif; font-size: 36px; letter-spacing: 0.12em; color: #D6DDE6">3AM<span style="color: {{accent}}">ROLLERS</span></div>
<div style="font-size: 15px; letter-spacing: 0.18em; color: #8A97AB">DRUM &amp; BASS · LIQUID · 2000–2006</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 88px; height: 88px; border-radius: 50%; background: #121B2E; display: flex; align-items: center; justify-content: center">
<svg width="60" height="60" viewBox="0 0 280 280" aria-hidden="true">
<circle cx="140" cy="140" r="100" fill="none" stroke="#D6DDE6" stroke-width="18"></circle>
<line x1="140" y1="140" x2="140" y2="70" stroke="#D6DDE6" stroke-width="16" stroke-linecap="round"></line>
<line x1="140" y1="140" x2="196" y2="140" stroke="{{accent}}" stroke-width="22" stroke-linecap="round"></line>
</svg>
</div>
<div style="font-size: 14px; color: #8A97AB">como foto de perfil</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FB4E8"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8FB4E8', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
