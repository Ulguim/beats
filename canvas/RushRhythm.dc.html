<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RushRhythm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: 'Space Grotesk', sans-serif">
<svg width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Símbolo RushRhythm: barras de onda sonora inclinadas para frente, clareando como se acelerassem">
<g transform="translate(37.5 0) skewX(-15)">
<rect x="56" y="125" width="14" height="30" rx="7" fill="#2A3D5E"></rect>
<rect x="82" y="110" width="14" height="60" rx="7" fill="#3A5480"></rect>
<rect x="108" y="85" width="14" height="110" rx="7" fill="#4E6E9E"></rect>
<rect x="134" y="55" width="14" height="170" rx="7" fill="#6F93C9"></rect>
<rect x="160" y="40" width="14" height="200" rx="7" fill="{{accent}}"></rect>
<rect x="186" y="70" width="14" height="140" rx="7" fill="#B5CCEE"></rect>
<rect x="212" y="105" width="14" height="70" rx="7" fill="#D6DDE6"></rect>
</g>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-family: 'Michroma', sans-serif; font-size: 36px; letter-spacing: 0.12em; color: #D6DDE6">RUSH<span style="color: {{accent}}">RHYTHM</span></div>
<div style="font-size: 15px; letter-spacing: 0.18em; color: #8A97AB">DRUM &amp; BASS · LIQUID · 2000–2006</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 88px; height: 88px; border-radius: 50%; background: #121B2E; display: flex; align-items: center; justify-content: center">
<svg width="60" height="60" viewBox="0 0 280 280" aria-hidden="true">
<g transform="translate(37.5 0) skewX(-15)">
<rect x="70" y="100" width="26" height="80" rx="13" fill="#4E6E9E"></rect>
<rect x="112" y="50" width="26" height="180" rx="13" fill="{{accent}}"></rect>
<rect x="154" y="30" width="26" height="220" rx="13" fill="#B5CCEE"></rect>
<rect x="196" y="85" width="26" height="110" rx="13" fill="#D6DDE6"></rect>
</g>
</svg>
</div>
<div style="font-size: 14px; color: #8A97AB">como foto de perfil</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FB4E8"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8FB4E8', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
