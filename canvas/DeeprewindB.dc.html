<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Deeprewind selo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: 'Space Grotesk', sans-serif">
<svg width="400" height="400" viewBox="0 0 320 320" role="img" aria-label="Selo Deeprewind">
<defs>
<path id="top" d="M32 160 A128 128 0 0 1 288 160"/>
<path id="bot" d="M18 160 A142 142 0 0 0 302 160"/>
</defs>
<circle cx="160" cy="160" r="154" fill="none" stroke="{{accent}}" stroke-width="4"/>
<circle cx="160" cy="160" r="104" fill="#121B2E" stroke="#2A3D5E" stroke-width="2"/>
<text font-family="Syncopate, sans-serif" font-weight="700" font-size="20" letter-spacing="5" fill="#D6DDE6"><textPath href="#top" startOffset="50%" text-anchor="middle">DEEPREWIND</textPath></text>
<text font-family="Space Grotesk, sans-serif" font-size="12" letter-spacing="4" fill="#8A97AB"><textPath href="#bot" startOffset="50%" text-anchor="middle">DRUM &amp; BASS · LIQUID · BREAKS</textPath></text>
<circle cx="22" cy="160" r="4" fill="{{accent}}"/><circle cx="298" cy="160" r="4" fill="{{accent}}"/>
<g transform="translate(160 160) scale(0.62) translate(-140 -140)">
<circle cx="140" cy="140" r="100" fill="#121B2E" stroke="#D6DDE6" stroke-width="5.6"/>
<circle cx="140" cy="140" r="78" fill="none" stroke="#3A5480" stroke-width="4.199999999999999"/>
<circle cx="140" cy="140" r="58" fill="none" stroke="#3A5480" stroke-width="4.199999999999999"/>
<path d="M148 116 L112 140 L148 164 Z M184 116 L148 140 L184 164 Z" fill="{{accent}}"/>
</g>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.1em; color: #D6DDE6">DEEP<span style="color: {{accent}}; font-weight: 400">REWIND</span></div>
<div style="font-size: 14px; letter-spacing: 0.24em; color: #8A97AB">EST. 2000 · ERA PS2</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A13B"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F2A13B', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
