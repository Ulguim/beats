<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MovingMinds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: 'Space Grotesk', sans-serif">
<svg width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Símbolo MovingMinds: um círculo sólido deixando ecos para trás, como se estivesse em movimento">
<circle cx="74" cy="140" r="56" fill="none" stroke="#3A5480" stroke-width="3"></circle>
<circle cx="112" cy="140" r="56" fill="none" stroke="#5F82B8" stroke-width="3"></circle>
<circle cx="150" cy="140" r="56" fill="none" stroke="{{accent}}" stroke-width="3"></circle>
<circle cx="196" cy="140" r="56" fill="#D6DDE6"></circle>
<circle cx="212" cy="126" r="16" fill="{{bg}}"></circle>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-family: 'Michroma', sans-serif; font-size: 36px; letter-spacing: 0.12em; color: #D6DDE6">MOVING<span style="color: {{accent}}">MINDS</span></div>
<div style="font-size: 15px; letter-spacing: 0.18em; color: #8A97AB">DRUM &amp; BASS · LIQUID · 2000–2006</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 88px; height: 88px; border-radius: 50%; background: #121B2E; display: flex; align-items: center; justify-content: center">
<svg width="60" height="60" viewBox="0 0 280 280" aria-hidden="true">
<circle cx="92" cy="140" r="70" fill="none" stroke="#5F82B8" stroke-width="10"></circle>
<circle cx="140" cy="140" r="70" fill="none" stroke="{{accent}}" stroke-width="10"></circle>
<circle cx="190" cy="140" r="70" fill="#D6DDE6"></circle>
<circle cx="210" cy="122" r="20" fill="#121B2E"></circle>
</svg>
</div>
<div style="font-size: 14px; color: #8A97AB">como foto de perfil</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FB4E8"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8FB4E8', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
