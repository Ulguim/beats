<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BugBeats selo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: 'Space Grotesk', sans-serif">

<circle cx="95" cy="150" r="52" fill="#121B2E" stroke="#D6DDE6" stroke-width="6.5"/>

<circle cx="95" cy="150" r="26" fill="none" stroke="#3A5480" stroke-width="3.9000000000000004"/>
<circle cx="95" cy="150" r="13" fill="{{accent}}"/><circle cx="95" cy="150" r="3" fill="#121B2E"/>
<path d="M147 150 L130 150" stroke="#D6DDE6" stroke-width="7.800000000000001"/>
<ellipse cx="165" cy="150" rx="22" ry="16" fill="#D6DDE6"/>
<path d="M187 150 L196 148" stroke="#D6DDE6" stroke-width="7.800000000000001"/>

</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.1em; color: #D6DDE6">BUG<span style="color: {{accent}}; font-weight: 400">BEATS</span></div>
<div style="font-size: 14px; letter-spacing: 0.24em; color: #8A97AB">EST. 2000 · ERA PS2</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A13B"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F2A13B', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
