<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SubSignal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; font-family: 'Space Grotesk', sans-serif">
<svg width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Símbolo SubSignal: uma onda grave longa com um ponto de sinal pulsando na crista">
<path d="M20 140 C 60 30, 100 30, 140 140 S 220 250, 260 140" fill="none" stroke="#3A5480" stroke-width="4" stroke-linecap="round"></path>
<path d="M20 140 C 60 80, 100 80, 140 140 S 220 200, 260 140" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round"></path>
<circle cx="80" cy="95" r="22" fill="none" stroke="#D6DDE6" stroke-opacity="0.4" stroke-width="3"></circle>
<circle cx="80" cy="95" r="9" fill="#D6DDE6"></circle>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="font-family: 'Michroma', sans-serif; font-size: 36px; letter-spacing: 0.12em; color: #D6DDE6">SUB<span style="color: {{accent}}">SIGNAL</span></div>
<div style="font-size: 15px; letter-spacing: 0.18em; color: #8A97AB">DRUM &amp; BASS · LIQUID · 2000–2006</div>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 88px; height: 88px; border-radius: 50%; background: #121B2E; display: flex; align-items: center; justify-content: center">
<svg width="60" height="60" viewBox="0 0 280 280" aria-hidden="true">
<path d="M20 140 C 60 60, 100 60, 140 140 S 220 220, 260 140" fill="none" stroke="{{accent}}" stroke-width="20" stroke-linecap="round"></path>
<circle cx="80" cy="85" r="22" fill="#D6DDE6"></circle>
</svg>
</div>
<div style="font-size: 14px; color: #8A97AB">como foto de perfil</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8FB4E8"},"bg":{"editor":"color","default":"#0B1220"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8FB4E8', bg: this.props.bg ?? '#0B1220' };
}
}
</script>
</body>
</html>
